<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Hub — Code Studio</title><link rel="stylesheet" href="css/code-studio.css"></head><body>
<header><div class="brand"><span>TH</span><b>Code Studio</b></div><div class="project"><b>Hassaco Website</b><small>main branch · autosave enabled</small></div><div class="actions"><button id="save">Save</button><button id="run">▶ Run</button></div></header>
<main><aside class="files"><div class="label">FILES</div><button class="file active" data-file="index.html">◇ index.html</button><button class="file" data-file="style.css">◇ style.css</button><button class="file" data-file="script.js">◇ script.js</button><button class="file" data-file="README.md">◇ README.md</button></aside>
<section class="editor"><div class="tabs"><span id="tab">index.html</span><span id="saveState">Saved</span></div><textarea id="editor" spellcheck="false"></textarea><div class="console"><div class="console-head"><b>Console</b><button id="clear">Clear</button></div><pre id="logs">Ready.</pre></div></section>
<section class="preview"><div class="preview-head"><b>Preview</b><button id="refresh">↻</button></div><iframe id="frame" sandbox="allow-scripts"></iframe></section></main>
<div id="toast" class="toast hidden"></div>
<script src="js/studio.js"></script></body></html>
